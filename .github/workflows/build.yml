name: Build dist

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build dist bundle
        run: npm run build

      - name: Commit rebuilt dist bundle
        run: |
          if git diff --quiet -- dist/index.cjs; then
            echo "dist/index.cjs is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.cjs
          git commit -m "chore: rebuild dist [skip ci]"
          git push
